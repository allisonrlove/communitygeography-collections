---
layout: base-unm
---
<section class="welcome-hero" aria-labelledby="welcome-title">
  {{ content }}
</section>

<section class="instagram-feed" aria-labelledby="instagram-title" data-instagram-username="nmcommunitygeog">
  <div class="instagram-feed-header">
    <div>
      <p class="instagram-feed-kicker">From the field</p>
      <h2 id="instagram-title">Follow our community</h2>
    </div>
    <a class="instagram-profile-link" href="https://www.instagram.com/nmcommunitygeog/" target="_blank" rel="noopener noreferrer">
      @nmcommunitygeog <span aria-hidden="true">↗</span>
    </a>
  </div>

  <div class="instagram-carousel" aria-label="Latest posts from the Center for Community Geography on Instagram">
    <button class="instagram-carousel-control instagram-carousel-control--previous" type="button" aria-label="Show previous Instagram posts" disabled>
      <span aria-hidden="true">←</span>
    </button>
    <div class="instagram-carousel-track" tabindex="0" aria-live="polite">
      <p class="instagram-feed-status">Loading the latest posts from Instagram…</p>
    </div>
    <button class="instagram-carousel-control instagram-carousel-control--next" type="button" aria-label="Show next Instagram posts" disabled>
      <span aria-hidden="true">→</span>
    </button>
  </div>

  <p class="instagram-feed-fallback" hidden>
    The latest posts are currently available on
    <a href="https://www.instagram.com/nmcommunitygeog/" target="_blank" rel="noopener noreferrer">Instagram</a>.
  </p>
  <noscript>
    <p class="instagram-feed-fallback">
      View the latest posts on
      <a href="https://www.instagram.com/nmcommunitygeog/" target="_blank" rel="noopener noreferrer">Instagram</a>.
    </p>
  </noscript>
</section>

<script src="{{ '/assets/js/instagram-carousel.js' | relative_url }}" defer></script>
